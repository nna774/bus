<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>バス渋滞パズル（仮）</title>
<style>
  :root {
    --cell: 56px;
    --gap: 4px;
    --bg: #12141c;
    --panel: #1c1f2b;
    --text: #eef0f6;
    --muted: #6b7080;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  #app {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1 {
    font-size: 16px;
    font-weight: 600;
    color: var(--muted);
    margin: 0;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .header button {
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    flex: none;
  }
  .panel {
    background: var(--panel);
    border-radius: 12px;
    padding: 10px;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .controls select {
    font-size: 12px;
    padding: 4px 6px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.2);
    background: var(--panel);
    color: var(--text);
  }
  .queue {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 34px;
  }
  .run {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    padding: 3px;
    border-radius: 14px;
    background: rgba(255,255,255,0.05);
  }
  .window {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 5px;
    border-radius: 18px;
    background: rgba(255,255,255,0.16);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.5);
  }
  .window .run { background: rgba(0,0,0,0.25); }
  .rest {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    opacity: 0.85;
  }
  .person {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.25);
    flex: none;
  }
  .parking {
    display: flex;
    gap: 6px;
  }
  .slot {
    flex: 1;
    min-width: 0;
    height: 44px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    border: 2px dashed rgba(255,255,255,0.15);
    background: transparent;
  }
  .slot.filled {
    border-style: solid;
    border-color: rgba(0,0,0,0.25);
  }
  .board {
    position: relative;
    display: grid;
    gap: var(--gap);
    justify-content: center;
    background: #0b0d13;
    border-radius: 8px;
    padding: var(--gap);
  }
  .board .cell {
    width: var(--cell);
    height: var(--cell);
    background: rgba(255,255,255,0.03);
    border-radius: 4px;
  }
  .bus {
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(0,0,0,0.55);
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.15s, transform 0.15s;
    user-select: none;
  }
  .bus.escapable {
    opacity: 1;
  }
  .bus.escapable:active {
    transform: scale(0.96);
  }
  .bus.h { flex-direction: row; }
  .bus.v { flex-direction: column; }
  .bus.dir-r { justify-content: flex-end; }
  .bus.dir-l { justify-content: flex-start; }
  .bus.dir-d { justify-content: flex-end; }
  .bus.dir-u { justify-content: flex-start; }
  .bus.shake {
    animation: shake 0.25s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  .cap-badge {
    padding: 0 6px;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 700;
  }
  .overlay.hidden { display: none; }
  .overlay button {
    font-size: 15px;
    padding: 8px 20px;
    border-radius: 8px;
    border: none;
    background: #fff;
    cursor: pointer;
  }
</style>
</head>

<div id="app">

  <div class="panel">

  </div>
  <div id="board" class="board"></div>
</div>
<div id="overlay" class="overlay hidden">
  <div id="overlay-text"></div>
  <button id="overlay-restart">次の面</button>
</div>

<script>
"use strict";

// ---------- 色 ----------
const COLOR_HEX = {
  red: "#e74c3c",
  blue: "#3498db",
  green: "#27ae60",
  orange: "#f39c12",
  purple: "#9b59b6",
  teal: "#1abc9c",
  pink: "#e84393",
  yellow: "#f1c40f",
};

// ---------- 純粋ロジック（Node からも呼べる。DOM に触らない） ----------

function buildLevel(def) {
  const busesById = {};
  for (const b of def.buses) busesById[b.id] = b;
  return Object.assign({ windowSize: 1 }, def, { busesById });
}

function cellsOf(bus) {
  const cells = [];
  if (bus.orientation === "H") {
    for (let i = 0; i < bus.len; i++) cells.push([bus.r, bus.c + i]);
  } else {
    for (let i = 0; i < bus.len; i++) cells.push([bus.r + i, bus.c]);
  }
  return cells;
}

// バスの進行方向の先、盤外に出るまでのセル列。先端が既に盤端ならから配列。
function pathCells(bus, gridW, gridH) {
  const cells = [];
  if (bus.orientation === "H") {
    if (bus.dir === "R") {
      for (let c = bus.c + bus.len; c < gridW; c++) cells.push([bus.r, c]);
    } else {
      for (let c = bus.c - 1; c >= 0; c--) cells.push([bus.r, c]);
    }
  } else {
    if (bus.dir === "D") {
      for (let r = bus.r + bus.len; r < gridH; r++) cells.push([r, bus.c]);
    } else {
      for (let r = bus.r - 1; r >= 0; r--) cells.push([r, bus.c]);
    }
  }
  return cells;
}

function occupancyMap(boardRemaining, level) {
  const map = new Map();
  for (const id of boardRemaining) {
    for (const [r, c] of cellsOf(level.busesById[id])) map.set(r + "," + c, id);
  }
  return map;
}

function isEscapableGeometry(bus, occMap, level) {
  for (const [r, c] of pathCells(bus, level.gridW, level.gridH)) {
    if (occMap.has(r + "," + c)) return false;
  }
  return true;
}

function hasFreeSlot(state) {
  return state.parking.some((s) => s === null);
}

// 現在タップして駐車場へ移動できるバスの id 一覧
function escapableBuses(state, level) {
  if (!hasFreeSlot(state)) return [];
  const occ = occupancyMap(state.boardRemaining, level);
  const out = [];
  for (const id of state.boardRemaining) {
    if (isEscapableGeometry(level.busesById[id], occ, level)) out.push(id);
  }
  return out;
}

function canTap(state, busId, level) {
  if (state.won || state.lost) return false;
  if (!state.boardRemaining.has(busId)) return false;
  if (!hasFreeSlot(state)) return false;
  const occ = occupancyMap(state.boardRemaining, level);
  return isEscapableGeometry(level.busesById[busId], occ, level);
}

// キュー先頭から windowSize 人のうち、駐車中のバスと色が合う最初の人の位置。無ければ -1。
function boardableIndex(state, level) {
  const n = Math.min(level.windowSize, state.queue.length);
  for (let i = 0; i < n; i++) {
    if (state.parking.some((s) => s && s.color === state.queue[i])) return i;
  }
  return -1;
}

function processQueue(state, level) {
  while (true) {
    const i = boardableIndex(state, level);
    if (i === -1) break;
    const color = state.queue[i];
    const slotIdx = state.parking.findIndex((s) => s && s.color === color);
    state.queue.splice(i, 1);
    state.parking[slotIdx].boarded++;
    if (state.parking[slotIdx].boarded === state.parking[slotIdx].cap) {
      state.parking[slotIdx] = null;
    }
  }
}

// state を破壊的に変更する。事前に canTap で確認していること。
function applyTap(state, busId, level) {
  const bus = level.busesById[busId];
  state.boardRemaining.delete(busId);
  const slotIdx = state.parking.findIndex((s) => s === null);
  state.parking[slotIdx] = { color: bus.color, boarded: 0, cap: bus.len };
  processQueue(state, level);
}

function cloneState(state) {
  return {
    boardRemaining: new Set(state.boardRemaining),
    parking: state.parking.map((s) => (s ? Object.assign({}, s) : null)),
    queue: state.queue.slice(),
  };
}

function isWin(state) {
  return state.boardRemaining.size === 0 && state.queue.length === 0;
}

// 前進不能（窓の誰も駐車中のバスに乗れず、かつ新しいバスも呼べない）かどうか
function isStuck(state, level) {
  if (state.queue.length === 0) return false;
  if (boardableIndex(state, level) !== -1) return false;
  const canBringNew = hasFreeSlot(state) && escapableBuses(state, level).length > 0;
  return !canBringNew;
}

function initialState(level) {
  return {
    boardRemaining: new Set(level.buses.map((b) => b.id)),
    parking: new Array(level.parkingCapacity).fill(null),
    queue: level.queue.slice(),
    won: false,
    lost: false,
  };
}

// 総当たり DFS でこのレベルにクリア可能な手順が存在するか検証する。
// 生成器がまだ無い v1 では、手作りレベルの検算に使う。
function verifySolvable(level) {
  const start = initialState(level);
  const visited = new Set();
  function key(state) {
    return (
      [...state.boardRemaining].sort().join(",") +
      "|" +
      state.parking.map((s) => (s ? s.color + ":" + s.boarded : "_")).join(",") +
      "|" +
      state.queue.join(",")
    );
  }
  function dfs(state) {
    if (isWin(state)) return true;
    if (isStuck(state, level)) return false;
    const k = key(state);
    if (visited.has(k)) return false;
    visited.add(k);
    for (const busId of escapableBuses(state, level)) {
      const next = cloneState(state);
      applyTap(next, busId, level);
      if (dfs(next)) return true;
    }
    return false;
  }
  return dfs(start);
}

// ---------- レベル生成器 ----------
// arrow の carve→peel を踏襲: 「バスの配置」と「向きの決定」を分離する。
// 1. place: 直線バスを重ならないようランダムに敷き詰める（向きは未定）。
// 2. peel: 満杯の盤から「今のこの向きなら盤外までクリア」なバスを1本ずつ剥がす。
//    剥がした順がそのまま可解な脱出順になる（arrowのDESIGN_NOTES参照）。
// 3. 色とキューの割当: peel順の各バスにユニーク色を振り、キューは
//    「色のマルチセットをランダムに並べ替えたもの」から verifySolvable が
//    通るものを探す。peel順どおりに一色ずつ流し込むと一本道の退屈な面に
//    なってしまうため、あえてシャッフルしてから解けるか検算する。

function placeBuses(gridW, gridH, opts) {
  const occ = Array.from({ length: gridH }, () => new Array(gridW).fill(null));
  const buses = [];
  let nextId = 1;
  const targetCells = Math.floor(gridW * gridH * opts.density);
  const lenWeights = opts.lenWeights;
  function pickLen() {
    const r = Math.random();
    let acc = 0;
    for (const [len, w] of lenWeights) {
      acc += w;
      if (r <= acc) return len;
    }
    return lenWeights[lenWeights.length - 1][0];
  }
  let filled = 0;
  let attempts = 0;
  while (filled < targetCells && attempts < opts.maxPlaceAttempts) {
    attempts++;
    const orientation = Math.random() < 0.5 ? "H" : "V";
    const len = pickLen();
    let r, c;
    if (orientation === "H") {
      if (len > gridW) continue;
      r = Math.floor(Math.random() * gridH);
      c = Math.floor(Math.random() * (gridW - len + 1));
    } else {
      if (len > gridH) continue;
      c = Math.floor(Math.random() * gridW);
      r = Math.floor(Math.random() * (gridH - len + 1));
    }
    let ok = true;
    for (let i = 0; i < len && ok; i++) {
      const rr = orientation === "H" ? r : r + i;
      const cc = orientation === "H" ? c + i : c;
      if (occ[rr][cc]) ok = false;
    }
    if (!ok) continue;
    const id = "b" + nextId++;
    for (let i = 0; i < len; i++) {
      const rr = orientation === "H" ? r : r + i;
      const cc = orientation === "H" ? c + i : c;
      occ[rr][cc] = id;
    }
    buses.push({ id, orientation, r, c, len });
    filled += len;
  }
  return buses;
}

// 敷き詰めたバス（向き未定）から、剥がせる順に dir を確定させていく。
// 詰まって剥がせなくなったら null を返す（呼び出し側で置き直す）。
function peelOrder(rawBuses, gridW, gridH) {
  const remaining = new Map(rawBuses.map((b) => [b.id, b]));
  const order = [];
  function isClear(bus, dir) {
    const path = pathCells(Object.assign({}, bus, { dir }), gridW, gridH);
    for (const [r, c] of path) {
      for (const other of remaining.values()) {
        if (other.id === bus.id) continue;
        for (const [orr, occc] of cellsOf(other)) {
          if (orr === r && occc === c) return false;
        }
      }
    }
    return true;
  }
  while (remaining.size > 0) {
    const candidates = [];
    for (const b of remaining.values()) {
      const dirs = b.orientation === "H" ? ["L", "R"] : ["U", "D"];
      for (const dir of dirs) {
        if (isClear(b, dir)) candidates.push({ id: b.id, dir, len: b.len });
      }
    }
    if (candidates.length === 0) return null;
    // レイの長い剥がし候補を優先（arrowのpeelと同じ重み付け）。
    const weighted = candidates.map((cd) => ({ ...cd, w: Math.pow(cd.len + 1, 1.5) }));
    const totalW = weighted.reduce((s, x) => s + x.w, 0);
    let roll = Math.random() * totalW;
    let picked = weighted[weighted.length - 1];
    for (const cd of weighted) {
      if (roll <= cd.w) {
        picked = cd;
        break;
      }
      roll -= cd.w;
    }
    const bus = remaining.get(picked.id);
    order.push(Object.assign({}, bus, { dir: picked.dir }));
    remaining.delete(picked.id);
  }
  return order;
}

const PALETTE = ["red", "blue", "green", "orange", "purple", "teal", "pink", "yellow"];

// escapable かつ枠が空いていれば、今の窓の色と合うものを優先し、
// 無ければ最初に見つかったものをタップする、という素朴な貪欲方針。
// これで解けてしまう面は「先読み不要」なので、生成時にはじく対象にする。
function naiveGreedySolves(level) {
  const state = initialState(level);
  const seen = new Set();
  while (true) {
    if (isWin(state)) return true;
    if (isStuck(state, level)) return false;
    const options = escapableBuses(state, level);
    if (options.length === 0) return false;
    const windowColors = state.queue.slice(0, level.windowSize);
    const preferred = options.find((id) => windowColors.includes(level.busesById[id].color));
    applyTap(state, preferred || options[0], level);
    const k = state.queue.length + "|" + [...state.boardRemaining].sort().join(",");
    if (seen.has(k)) return false; // 保険（理論上は起きないはず）
    seen.add(k);
  }
}

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateLevel(opts) {
  opts = Object.assign(
    {
      gridW: 6,
      gridH: 6,
      parkingCapacity: 3,
      windowSize: 1,
      density: 0.55,
      lenWeights: [
        [1, 0.35],
        [2, 0.45],
        [3, 0.2],
      ],
      maxPlaceAttempts: 200,
      maxPlacementRetries: 40,
      maxQueueShuffles: 300,
    },
    opts
  );
  for (let placeTry = 0; placeTry < opts.maxPlacementRetries; placeTry++) {
    const raw = placeBuses(opts.gridW, opts.gridH, opts);
    if (raw.length === 0) continue;
    const order = peelOrder(raw, opts.gridW, opts.gridH);
    if (!order) continue;
    const buses = order.map((b, i) =>
      Object.assign({}, b, { color: PALETTE[i % PALETTE.length] })
    );
    const level = buildLevel({
      gridW: opts.gridW,
      gridH: opts.gridH,
      parkingCapacity: opts.parkingCapacity,
      windowSize: opts.windowSize,
      buses,
      queue: [],
    });
    const multiset = [];
    for (const b of buses) for (let i = 0; i < b.len; i++) multiset.push(b.color);

    let fallback = null;
    for (let q = 0; q < opts.maxQueueShuffles; q++) {
      level.queue = shuffled(multiset);
      if (!verifySolvable(level)) continue;
      if (!fallback) fallback = level.queue.slice();
      if (!naiveGreedySolves(level)) {
        return buildLevel({
          gridW: opts.gridW,
          gridH: opts.gridH,
          parkingCapacity: opts.parkingCapacity,
          windowSize: opts.windowSize,
          buses,
          queue: level.queue,
        });
      }
    }
    if (fallback) {
      return buildLevel({
        gridW: opts.gridW,
        gridH: opts.gridH,
        parkingCapacity: opts.parkingCapacity,
        windowSize: opts.windowSize,
        buses,
        queue: fallback,
      });
    }
  }
  return null; // 呼び出し側でリトライ or 固定レベルへのフォールバック
}

// ---------- v1 検証用レベル（手作り）。生成器の対照用に残す ----------
// b1 が抜けないと b2 (同じ行, 左側をふさぐ) と b5 (同じ列, 上側をふさぐ) が
// 脱出できない、という依存関係だけを持つ最小構成。
const LEVEL_1 = {
  gridW: 5,
  gridH: 5,
  parkingCapacity: 3,
  buses: [
    { id: "b1", color: "red", orientation: "H", r: 2, c: 1, len: 2, dir: "L" },
    { id: "b2", color: "blue", orientation: "H", r: 2, c: 3, len: 2, dir: "L" },
    { id: "b3", color: "green", orientation: "V", r: 3, c: 0, len: 2, dir: "D" },
    { id: "b4", color: "orange", orientation: "V", r: 0, c: 4, len: 2, dir: "U" },
    { id: "b5", color: "purple", orientation: "V", r: 3, c: 1, len: 2, dir: "U" },
  ],
  queue: [
    "red", "red", "green", "green", "orange", "orange",
    "blue", "blue", "purple", "purple",
  ],
};

// Node (`node -e` 等) からこのファイルの純粋ロジックだけを取り出して
// 検証したい場合のためのフック。ブラウザでは何もしない。
if (typeof module !== "undefined") {
  module.exports = {
    buildLevel,
    verifySolvable,
    LEVEL_1,
    initialState,
    escapableBuses,
    applyTap,
    isWin,
    isStuck,
    generateLevel,
    placeBuses,
    peelOrder,
    naiveGreedySolves,
  };
}

// ---------- DOM 描画 & 操作（ここから下はブラウザ専用） ----------
if (typeof window !== "undefined" && typeof document !== "undefined") {
  let level;
  let state;

  const boardEl = document.getElementById("board");
  const parkingEl = document.getElementById("parking");
  const queueEl = document.getElementById("queue");
  const overlayEl = document.getElementById("overlay");
  const overlayTextEl = document.getElementById("overlay-text");

  const forceStatic = new URLSearchParams(location.search).get("level") === "1";
  const gridSel = document.getElementById("opt-grid");
  const parkingSel = document.getElementById("opt-parking");
  const windowSel = document.getElementById("opt-window");
  const appEl = document.getElementById("app");

  const pregen = JSON.parse(document.getElementById("pregen").textContent);

  function decodeLevel(enc) {
    const buses = enc.buses.map(([r, c, len, orientation, dir, color], i) => ({
      id: "b" + (i + 1),
      r,
      c,
      len,
      orientation,
      dir,
      color: PALETTE[color],
    }));
    const queue = [...enc.queue].map((ch) => PALETTE[Number(ch)]);
    return buildLevel({
      gridW: enc.gridW,
      gridH: enc.gridH,
      parkingCapacity: enc.parkingCapacity,
      windowSize: enc.windowSize,
      buses,
      queue,
    });
  }

  function newGame() {
    const n = Number(gridSel.value);
    const k = Number(windowSel.value);
    const pool = pregen[n + "x" + n + ":" + k];
    parkingSel.disabled = Boolean(pool);
    if (forceStatic) {
      level = buildLevel(LEVEL_1);
    } else if (pool && pool.length > 0) {
      level = decodeLevel(pool[Math.floor(Math.random() * pool.length)]);
      parkingSel.value = String(level.parkingCapacity);
    } else {
      level =
        generateLevel({
          gridW: n,
          gridH: n,
          parkingCapacity: Number(parkingSel.value),
          windowSize: k,
        }) || buildLevel(LEVEL_1);
    }
    state = initialState(level);
    render();
  }

  // 盤面が画面幅に収まるようにセルの大きさを決める。
  function fitCell() {
    const gap = 4;
    const avail = appEl.clientWidth - 2 * gap - 20;
    const cell = Math.floor((avail - (level.gridW - 1) * gap) / level.gridW);
    document.documentElement.style.setProperty("--cell", Math.max(24, Math.min(56, cell)) + "px");
  }

  function onTapBus(busId, el) {
    if (state.won || state.lost) return;
    if (!canTap(state, busId, level)) {
      el.classList.remove("shake");
      void el.offsetWidth;
      el.classList.add("shake");
      return;
    }
    applyTap(state, busId, level);
    if (isWin(state, level)) state.won = true;
    else if (isStuck(state, level)) state.lost = true;
    render();
  }

  function render() {
    fitCell();
    renderBoard();
    renderParking();
    renderQueue();
    renderOverlay();
  }

  function renderBoard() {
    boardEl.style.gridTemplateColumns = `repeat(${level.gridW}, var(--cell))`;
    boardEl.style.gridTemplateRows = `repeat(${level.gridH}, var(--cell))`;
    boardEl.innerHTML = "";
    for (let i = 0; i < level.gridW * level.gridH; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.style.gridRow = String(Math.floor(i / level.gridW) + 1);
      cell.style.gridColumn = String((i % level.gridW) + 1);
      boardEl.appendChild(cell);
    }
    const escapable = new Set(escapableBuses(state, level));
    for (const id of state.boardRemaining) {
      const bus = level.busesById[id];
      const el = document.createElement("div");
      el.className = `bus ${bus.orientation.toLowerCase()} dir-${bus.dir.toLowerCase()}`;
      if (escapable.has(id)) el.classList.add("escapable");
      el.style.background = COLOR_HEX[bus.color];
      el.style.gridRow = bus.orientation === "V" ? `${bus.r + 1} / span ${bus.len}` : `${bus.r + 1}`;
      el.style.gridColumn = bus.orientation === "H" ? `${bus.c + 1} / span ${bus.len}` : `${bus.c + 1}`;
      el.textContent = bus.dir === "L" ? "◀" : bus.dir === "R" ? "▶" : bus.dir === "U" ? "▲" : "▼";
      el.addEventListener("click", () => onTapBus(id, el));
      boardEl.appendChild(el);
    }
  }

  function renderParking() {
    parkingEl.innerHTML = "";
    for (const slot of state.parking) {
      const el = document.createElement("div");
      if (slot) {
        el.className = "slot filled";
        el.style.background = COLOR_HEX[slot.color];
        el.textContent = `${slot.boarded}/${slot.cap}`;
      } else {
        el.className = "slot";
        el.textContent = "空き";
      }
      parkingEl.appendChild(el);
    }
  }

  function renderQueue() {
    queueEl.innerHTML = "";
    const windowEl = document.createElement("div");
    windowEl.className = "window";
    const restEl = document.createElement("div");
    restEl.className = "rest";
    let runEl = null;
    let runColor = null;
    let runInWindow = null;
    state.queue.forEach((color, i) => {
      const inWindow = i < level.windowSize;
      if (color !== runColor || inWindow !== runInWindow) {
        runEl = document.createElement("div");
        runEl.className = "run";
        (inWindow ? windowEl : restEl).appendChild(runEl);
        runColor = color;
        runInWindow = inWindow;
      }
      const el = document.createElement("div");
      el.className = "person";
      el.style.background = COLOR_HEX[color];
      runEl.appendChild(el);
    });
    if (windowEl.children.length > 0) queueEl.appendChild(windowEl);
    if (restEl.children.length > 0) queueEl.appendChild(restEl);
  }

  function renderOverlay() {
    if (state.won) {
      overlayTextEl.textContent = "クリア！";
      overlayEl.classList.remove("hidden");
    } else if (state.lost) {
      overlayTextEl.textContent = "ゲームオーバー";
      overlayEl.classList.remove("hidden");
    } else {
      overlayEl.classList.add("hidden");
    }
  }

  document.getElementById("overlay-restart").addEventListener("click", newGame);
  document.getElementById("regenerate").addEventListener("click", newGame);
  gridSel.addEventListener("change", newGame);
  parkingSel.addEventListener("change", newGame);
  windowSel.addEventListener("change", newGame);
  window.addEventListener("resize", () => {
    fitCell();
  });

  newGame();

  if (new URLSearchParams(location.search).get("verify") === "1") {
    console.log("verifySolvable(level) =", verifySolvable(level));
  }
}
</script>
</body>
</html>
